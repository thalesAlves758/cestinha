<!doctype html>
<html lang="pt-BR" class="h-full overscroll-none">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget: on Android the layout shrinks above the keyboard (bottom sheets/bars stay visible). iOS ignores it and pans to the focused field itself. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Cestinha</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // Applies the saved theme before first paint (no flash). Key 'cestinha.theme' is duplicated in src/theme.js; keep both in sync.
    (function () {
      try {
        var mode = localStorage.getItem('cestinha.theme') || 'auto';
        var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#18201C' : '#FFFFFF');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles/output.css">
  <script src="version.js"></script>
</head>
<body class="bg-page text-ink min-h-full flex flex-col">
  <header class="sticky top-0 z-10 flex items-center justify-between bg-surface border-b border-line pl-4 pr-1 pt-[env(safe-area-inset-top)]">
    <h1 class="text-lg font-semibold text-primary">Cestinha</h1>
    <a href="#/settings" aria-label="Configurações" class="flex items-center justify-center w-12 h-12 text-xl rounded-full" data-settings-link>⚙️</a>
  </header>

  <main id="view" class="flex-1 w-full max-w-2xl mx-auto p-4"></main>

  <nav id="tabs" aria-label="Navegação principal" class="sticky bottom-0 z-10 grid grid-cols-2 bg-surface border-t border-line pb-[env(safe-area-inset-bottom)]">
    <a href="#/lists" data-tab="/lists" class="flex flex-col items-center justify-center min-h-14 py-1 text-sm text-muted aria-[current=page]:text-primary aria-[current=page]:font-semibold aria-[current=page]:underline underline-offset-4">
      <span aria-hidden="true">🛒</span><span>Listas</span>
    </a>
    <a href="#/templates" data-tab="/templates" class="flex flex-col items-center justify-center min-h-14 py-1 text-sm text-muted aria-[current=page]:text-primary aria-[current=page]:font-semibold aria-[current=page]:underline underline-offset-4">
      <span aria-hidden="true">📋</span><span>Templates</span>
    </a>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
